<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stop-Motion UI — Replay</title>
  <style>
    body {
      margin: 0;
      background: #1e1e1e;
      color: #ddd;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    }
    header {
      text-align: center;
      padding: 14px 0 6px;
    }
    h1 {
      font-size: 16px;
      font-weight: normal;
      color: #888;
      margin: 0;
    }
    #stage-wrap {
      display: flex;
      justify-content: center;
      margin: 16px 0;
    }
    #stage {
      background: #000;
      border: 1px solid #444;
      max-width: 90vw;
      height: auto;
    }
    #controls {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 900px;
      margin: 0 auto 24px;
      padding: 10px 14px;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      flex-wrap: wrap;
    }
    button {
      background: #3a3a3a;
      color: #ddd;
      border: 1px solid #4a4a4a;
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #454545; }
    input[type="range"] { flex: 1; min-width: 160px; }
    select {
      background: #3a3a3a;
      color: #ddd;
      border: 1px solid #4a4a4a;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 13px;
    }
    #time-label {
      font-size: 12px;
      color: #999;
      min-width: 90px;
      text-align: right;
      font-family: monospace;
    }
    #status {
      text-align: center;
      font-size: 12px;
      color: #777;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Stop-Motion UI — Replay Player</h1>
  </header>

  <div id="stage-wrap">
    <canvas id="stage" width="1280" height="800"></canvas>
  </div>

  <div id="status">Loading…</div>

  <div id="controls">
    <button id="play-btn" disabled>Play</button>
    <input id="scrub" type="range" min="0" max="1000" value="0" disabled />
    <span id="time-label">0.0s / 0.0s</span>
    <select id="speed-select">
      <option value="0.5">0.5x</option>
      <option value="1" selected>1x</option>
      <option value="1.5">1.5x</option>
      <option value="2">2x</option>
    </select>
    <select id="scenario-select">
      <option value="scenario-1">Scenario 1 — Dashboard settings</option>
      <option value="scenario-2">Scenario 2 — Onboarding wizard</option>
      <option value="scenario-3">Scenario 3 — Checkout flow</option>
    </select>
  </div>

  <script src="player.js"></script>
</body>
</html>
