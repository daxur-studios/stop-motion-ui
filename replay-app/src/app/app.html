<div class="app-shell" [attr.data-busy]="busyService.busy() ? 'true' : 'false'">
  <nav class="top-nav" data-testid="app-nav">
    <button
      type="button"
      data-testid="nav-replay"
      [class.active]="view() === 'replay'"
      (click)="setView('replay')"
    >
      Replay Player
    </button>
    <button
      type="button"
      data-testid="nav-demos"
      [class.active]="view() === 'demos'"
      (click)="setView('demos')"
    >
      Demo Gallery
    </button>
    <button
      type="button"
      data-testid="nav-kitchen-sink"
      [class.active]="view() === 'kitchen-sink'"
      (click)="setView('kitchen-sink')"
    >
      Kitchen Sink
    </button>
  </nav>

  @if (view() === 'replay') {
    <app-replay-player />
  } @else if (view() === 'demos') {
    <app-demo-gallery />
  } @else {
    <app-kitchen-sink />
  }
</div>
