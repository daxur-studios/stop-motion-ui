<header>
  <h1>Stop-Motion UI — Replay Player (Angular)</h1>
</header>

<div id="stage-wrap">
  <canvas #stage id="stage" width="1280" height="800"></canvas>
</div>

<div id="status">{{ status() }}</div>

<div id="controls">
  <button id="play-btn" [disabled]="!ready()" (click)="togglePlay()">
    {{ isPlaying() ? 'Pause' : 'Play' }}
  </button>

  <input
    id="scrub"
    type="range"
    min="0"
    [max]="Math.max(1, Math.round(totalDurationMs()))"
    [value]="currentTimeMs()"
    [disabled]="!ready()"
    (input)="onScrubInput($event)"
    (change)="onScrubChange()"
  />

  <span id="time-label">{{ timeLabel() }}</span>

  <select id="speed-select" [value]="speed()" (change)="onSpeedChange($event)">
    <option value="0.5">0.5x</option>
    <option value="1">1x</option>
    <option value="1.5">1.5x</option>
    <option value="2">2x</option>
  </select>

  <select id="scenario-select" [value]="scenario()" (change)="onScenarioChange($event)">
    <option value="scenario-1">Scenario 1 — Dashboard settings</option>
    <option value="scenario-2">Scenario 2 — Onboarding wizard</option>
    <option value="scenario-3">Scenario 3 — Checkout flow</option>
    <option value="demo-gallery">Demo Gallery — real Playwright capture</option>
    <option value="daxur-daemon">Daxur Daemon — real Playwright capture</option>
  </select>

  <select
    id="narration-select"
    [value]="narrationMode()"
    (change)="onNarrationChange($event)"
    title="Narration (requires audio pre-generated via scripts/generate-narration.mjs)"
  >
    <option value="off">Narration: off</option>
    <option value="short">Narration: short</option>
    <option value="long">Narration: long</option>
  </select>
</div>

<div id="dev-tools">
  <span class="dev-tools-label">Dev tools</span>

  <button
    class="dev-btn"
    [disabled]="captureStatus() === 'running'"
    (click)="runCapture()"
    title="Run Playwright capture for the selected scenario (needs Angular app running)"
  >
    @if (captureStatus() === 'running') { Capturing… }
    @else if (captureStatus() === 'done') { Capture done ✓ }
    @else if (captureStatus() === 'error') { Capture failed ✗ }
    @else { Capture }
  </button>

  <label class="dev-checkbox" title="Open a visible browser window during capture">
    <input type="checkbox" [checked]="captureHeaded()" (change)="captureHeaded.set($any($event.target).checked)" />
    headed
  </label>

  <span class="dev-tools-sep"></span>

  <button
    class="dev-btn"
    [disabled]="ttsStatus() === 'running'"
    (click)="generateNarration()"
    title="Run generate-narration.mjs for the selected scenario (needs dev-server running)"
  >
    @if (ttsStatus() === 'running') { Generating TTS… }
    @else if (ttsStatus() === 'done') { TTS done ✓ }
    @else if (ttsStatus() === 'error') { TTS failed ✗ }
    @else { Generate TTS }
  </button>

  <button
    class="dev-btn"
    [disabled]="videoStatus() === 'running'"
    (click)="exportVideo()"
    title="Run export-video.mjs for the selected scenario (needs dev-server + ffmpeg + Pillow)"
  >
    @if (videoStatus() === 'running') { Exporting video… }
    @else if (videoStatus() === 'done') { Video done ✓ }
    @else if (videoStatus() === 'error') { Video failed ✗ }
    @else { Export Video }
  </button>

  <span class="dev-tools-hint">
    Requires <code>node scripts/dev-server.mjs</code> running in a separate terminal.
  </span>
</div>
